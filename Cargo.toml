[workspace]
resolver = "3"
members = ["crates/proto", "crates/config", "crates/daemon", "crates/client"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# measured: the dependencies need 1.89 (zbus 6, uuid), and the workspace checks on 1.89
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/publicusr/singularity"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# the Soloist build archive is unpacked and checked in Rust, not by `tar` (audit S4)
tar = "0.4"
flate2 = "1"

# (#71) smaller and a little faster binaries; `cargo install` uses this profile
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
