[package]
name = "singularityd"
publish = false
description = "Singularity Daemon: owns playback, the Catalogue session and local data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
singularity-proto = { path = "../proto" }
singularity-config = { path = "../config" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
libc = "0.2.191"
# a Soloist build archive is unpacked with checks on every member instead of `tar` (audit S4)
tar.workspace = true
flate2.workspace = true

librespot-core = { version = "=0.8.6", package = "spotatui-librespot-core" }
librespot-oauth = { version = "=0.8.6", package = "spotatui-librespot-oauth" }
librespot-protocol = { version = "=0.8.6", package = "spotatui-librespot-protocol" }
# the librespot Engine (D52): Spotify Connect receiver and player, audio out through cpal (CoreAudio, ALSA)
librespot-connect = { version = "=0.8.6", package = "spotatui-librespot-connect" }
librespot-playback = { version = "=0.8.6", package = "spotatui-librespot-playback" }
cpal = "0.16"
protobuf = "3.7"
rustfft = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
regex = "1"
# the notification cover's decode limits, the same ones the Client's covers use (B9)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# MPRIS and desktop notifications (6.x: zbus 5's zvariant/zbus_names helpers are unmaintained)
zbus = { version = "6.0", default-features = false, features = ["tokio", "proxy", "service"] }
# the listening log (bundled SQLite: no system library needed)
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Now Playing, media keys and Control Centre on macOS (the counterpart of MPRIS, #68)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSObject", "NSArray", "NSUUID"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "MPNowPlayingInfoCenter", "MPMediaItem", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFDate", "CFDictionary"] }
# the process tap on the Spotify app (#67)
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "objc2-core-audio-types", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[dev-dependencies]
tempfile = "3"
