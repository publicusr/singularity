[package]
name = "singularityd"
description = "Singularity Daemon: owns playback, the Catalogue session and local data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
singularity-proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
libc = "0.2.191"

librespot-core = { version = "=0.8.6", package = "spotatui-librespot-core" }
librespot-oauth = { version = "=0.8.6", package = "spotatui-librespot-oauth" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
